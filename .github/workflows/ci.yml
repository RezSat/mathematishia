name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

  python-wheel:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and install wheel into a clean Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip 'maturin>=1.9.4,<2'
          .venv/bin/maturin build --manifest-path crates/python/Cargo.toml --interpreter .venv/bin/python --out wheels
          .venv/bin/python -m pip install wheels/*.whl
      - name: Test installed Python package
        run: .venv/bin/python -m unittest discover -s crates/python/tests -v
