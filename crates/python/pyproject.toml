[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "mathematishia"
version = "0.1.0"
requires-python = ">=3.10"
description = "Exact symbolic mathematics from the Mathematishia Rust kernel"
readme = "README.md"
license = "Apache-2.0"

[tool.maturin]
python-source = "python"
module-name = "mathematishia._native"
bindings = "pyo3"
