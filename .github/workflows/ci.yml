name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

  python-wheel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install wheel into a clean Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip 'maturin>=1.9.4,<2'
          .venv/bin/maturin build --manifest-path crates/python/Cargo.toml --locked --interpreter .venv/bin/python --out wheels
          .venv/bin/python -m pip install wheels/*.whl
          .venv/bin/python -m pip check
      - name: Test installed Python package
        run: .venv/bin/python -m unittest discover -s crates/python/tests -v
