[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "mathematishia"
version = "0.1.0"
requires-python = ">=3.10"
description = "Exact symbolic mathematics and verified step evidence from a Rust kernel"
keywords = ["computer-algebra", "symbolic-mathematics", "exact-arithmetic", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
]
readme = "README.md"
license = "Apache-2.0"

[project.urls]
Repository = "https://github.com/RezSat/mathematishia"
Issues = "https://github.com/RezSat/mathematishia/issues"
Documentation = "https://github.com/RezSat/mathematishia/tree/main/docs"

[tool.maturin]
python-source = "python"
module-name = "mathematishia._native"
bindings = "pyo3"
