[package]
name = "mathematishia-python"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Python binding for the exact Mathematishia kernel"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
mathema = { path = "../mathema" }
mathema-frontend = { path = "../frontend" }
mathematishia-kernel = { path = "../kernel" }
pyo3 = { version = "=0.30.1", features = ["abi3-py310"] }
